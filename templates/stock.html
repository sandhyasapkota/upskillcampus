{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">KEEP THINGS MOVING</p><h1>Record stock movement</h1><p class="muted">Every change includes who made it and the resulting balance.</p></div></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ session.csrf }}"><label>Product<select name="product_id" required><option value="">Select a product</option>{% for p in products %}<option value="{{ p.id }}" {{ 'selected' if request.form.get('product_id',selected)|string==p.id|string }}>{{ p.name }} · {{ p.sku }} · {{ p.quantity }} in stock</option>{% endfor %}</select></label><div class="form-grid"><label>Movement type<select name="kind"><option value="in">Stock in — receive inventory</option><option value="out" {{ 'selected' if request.form.get('kind')=='out' }}>Stock out — issue inventory</option></select></label><label>Quantity<input name="amount" type="number" min="1" max="1000000000" required value="{{ request.form.get('amount','') }}"></label></div><label>Reason / reference<textarea name="note" maxlength="500" rows="3" placeholder="e.g. Supplier delivery PO-1042, sale, or damaged stock">{{ request.form.get('note','') }}</textarea></label><p class="help">Stock cannot go below zero. Movements are permanent; record an opposite movement to correct an error. Timestamps are in UTC.</p><div class="form-footer"><a class="button secondary" href="{{ url_for('products') }}">Cancel</a><button class="button" {{ 'disabled' if not products }}>Record movement</button></div></form>{% endblock %}
