{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">CATALOG MANAGEMENT</p><h1>{{ 'Edit product' if product else 'Add product' }}</h1><p class="muted">Stock quantities change through recorded movements.</p></div></div><form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ session.csrf }}"><div class="form-grid"><label>Product name<input name="name" maxlength="100" required value="{{ request.form.get('name',product.name if product else '') }}"></label><label>SKU<input name="sku" maxlength="40" required value="{{ request.form.get('sku',product.sku if product else '') }}" placeholder="e.g. EL-001"></label><label>Category<input name="category" maxlength="60" value="{{ request.form.get('category',product.category if product else '') }}"></label><label>Unit price<input name="price" type="number" min="0" max="10000000" step="0.01" required value="{{ request.form.get('price','%.2f'|format(product.price_cents/100) if product else '') }}"></label><label>Reorder level<input name="threshold" type="number" min="0" max="1000000000" required value="{{ request.form.get('threshold',product.threshold if product else 5) }}"><small>Alert when stock reaches or falls below this quantity.</small></label></div><div class="form-footer"><a class="button secondary" href="{{ url_for('products') }}">Cancel</a><button class="button">{{ 'Save changes' if product else 'Create product' }}</button></div></form>{% endblock %}
